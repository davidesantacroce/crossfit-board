<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE BOARD</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg-color: #121316;
      --card-bg: #1c1e22;
      --input-bg: #272a30;
      --accent: #e64a19;
      --text: #ffffff;
      --text-muted: #8e94a0;
      --border: #333740;
      --success: #4caf50;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 16px;
    }
    .header { 
      margin-bottom: 20px; 
      text-align: center; 
    }
    .logos-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
      padding: 0 8px;
    }
    .logo-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      max-width: 140px;
    }
    .logo-slot span {
      font-size: 8px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      text-transform: uppercase;
    }
    .logo-slot img {
      height: 36px;
      width: 100%;
      object-fit: contain;
      display: none;
    }
    .header h1 { font-size: 26px; font-weight: 900; letter-spacing: 1px; margin: 0; text-transform: uppercase; }
    .header p { color: var(--text-muted); margin: 4px 0 0 0; font-size: 13px; }
    
    .nav { display: flex; gap: 8px; margin-bottom: 20px; }
    .nav button {
      background: var(--card-bg); border: 1px solid var(--border); color: var(--text-muted);
      padding: 10px 16px; border-radius: 8px; font-weight: 700; font-size: 12px;
      text-transform: uppercase; cursor: pointer; flex: 1;
    }
    .nav button.active { background: var(--accent); color: var(--text); border-color: var(--accent); }

    .card {
      background: var(--card-bg); border-radius: 14px; padding: 20px;
      border: 1px solid var(--border); margin-bottom: 20px;
    }
    .card-title { font-size: 13px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 16px; }

    .form-group { margin-bottom: 16px; }
    .form-row { display: flex; gap: 12px; }
    .form-row .form-group { flex: 1; }

    label { display: block; font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
    input, select, textarea {
      width: 100%; background: var(--input-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px; color: var(--text); font-size: 14px; box-sizing: border-box; outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }

    .rx-scaled-toggle { display: flex; gap: 10px; margin-top: 10px; }
    .rx-btn {
      flex: 1; padding: 12px; background: var(--input-bg); border: 1px solid var(--border);
      color: var(--text-muted); font-weight: 800; border-radius: 8px; cursor: pointer; text-align: center;
    }
    .rx-btn.active { background: #2e7d32; color: #fff; border-color: #2e7d32; }

    .set-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .set-number { font-weight: 800; color: var(--text-muted); width: 20px; text-align: right; }
    .set-label { color: var(--text-muted); font-size: 12px; font-weight: 700; width: 60px; }

    .exercise-row {
      display: grid;
      grid-template-columns: 80px 1fr 35px;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }
    .exercise-row.has-weight {
      grid-template-columns: 80px 1fr 100px 35px;
    }
    .btn-remove {
      background: #c62828; color: white; border: none; border-radius: 6px;
      height: 42px; font-weight: bold; cursor: pointer;
    }
    .btn-add {
      background: var(--input-bg); border: 1px dashed var(--border); color: var(--text-muted);
      width: 100%; padding: 10px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 8px;
    }

    .btn-main {
      width: 100%; background: var(--accent); color: var(--text); border: none;
      padding: 14px; border-radius: 8px; font-weight: 800; text-transform: uppercase;
      font-size: 14px; cursor: pointer; margin-top: 10px;
    }
    .btn-import {
      background: var(--input-bg); border: 1px dashed var(--accent); color: var(--accent);
      text-align: center; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; display: block;
    }
    #imageInput { display: none; }
    #status { font-size: 12px; color: #0275d8; margin-top: 8px; text-align: center; }
    .history-item { border-bottom: 1px solid var(--border); padding: 12px 0; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>

  <div class="header">
    <div class="logos-wrapper">
      <div class="logo-slot">
        <span>Box</span>
        <img id="boxLogoPreview" src="" alt="Logo Box">
      </div>
      <div class="logo-slot">
        <span>Programmazione</span>
        <img id="progLogoPreview" src="" alt="Logo Programmazione">
      </div>
    </div>
    <h1>THE BOARD</h1>
    <p>i tuoi numeri, solo tuoi</p>
  </div>

  <div class="nav">
    <button class="active" onclick="switchTab('registra')">REGISTRA</button>
    <button onclick="switchTab('profilo')">PROFILO</button>
    <button onclick="switchTab('storico')">STORICO</button>
  </div>

  <!-- TAB REGISTRA -->
  <div id="tab-registra" class="tab-content active">
    
    <div class="card">
      <div class="card-title">IMPORTA DA FOTO</div>
      <label for="imageInput" class="btn-import">📷 Carica Screenshot WOD</label>
      <input type="file" id="imageInput" accept="image/*">
      <div id="status"></div>
    </div>

    <div class="card">
      <div class="card-title">NUOVO RISULTATO</div>

      <div class="form-group">
        <label>ATLETA (NOME E COGNOME)</label>
        <input type="text" id="athleteName" placeholder="Es. Mario Rossi">
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label>TIPO</label>
          <select id="wodType" onchange="renderResultFields()">
            <option value="For Time">For Time</option>
            <option value="AMRAP">AMRAP</option>
            <option value="Sets">Sets / Massimali (1RM)</option>
            <option value="EMOM">EMOM</option>
          </select>
        </div>
        <div class="form-group">
          <label>DATA</label>
          <input type="date" id="wodDate">
        </div>
      </div>

      <div class="form-group">
        <label>TITOLO O WOD</label>
        <input type="text" id="wodTitle" placeholder="Es. Fran o Power Snatch">
      </div>

      <div class="form-group">
        <label>MOVIMENTI ESERCIZIO</label>
        <div id="exercisesContainer"></div>
        <button type="button" class="btn-add" onclick="addExerciseRow()">+ Aggiungi Movimento</button>
      </div>

      <div class="form-group">
        <label id="resultLabel">SCORE</label>
        <div id="dynamicResultContainer"></div>
      </div>

      <div class="form-group">
        <label>MODALITÀ</label>
        <div class="rx-scaled-toggle">
          <div id="btnRx" class="rx-btn active" onclick="setMode('RX')">✓ RX</div>
          <div id="btnScaled" class="rx-btn" onclick="setMode('SCALED')">SCALED</div>
        </div>
      </div>

      <div class="form-group">
        <label>NOTE</label>
        <textarea id="wodNotes" placeholder="Sensazioni, pesi usati, scaling..."></textarea>
      </div>

      <button class="btn-main" id="btnSave" onclick="saveWod()">SALVA E INVIA A CLOUD</button>
    </div>

  </div>

  <!-- TAB PROFILO -->
  <div id="tab-profilo" class="tab-content">
    <div class="card">
      <div class="card-title">IMPOSTAZIONI PROFILO ATLETA</div>
      <div class="form-group">
        <label>NOME COMPLETO</label>
        <input type="text" id="profileName" placeholder="Es. Mario Rossi">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>SESSO</label>
          <select id="profileGender">
            <option value="M">Uomo (M)</option>
            <option value="F">Donna (F)</option>
          </select>
        </div>
        <div class="form-group">
          <label>PESO (KG)</label>
          <input type="number" id="profileWeight" placeholder="75">
        </div>
        <div class="form-group">
          <label>ALTEZZA (CM)</label>
          <input type="number" id="profileHeight" placeholder="175">
        </div>
      </div>
      <button class="btn-main" onclick="saveProfile()">SALVA PROFILO SU CLOUD</button>
    </div>

    <div class="card">
      <div class="card-title">GESTIONE LOGHI</div>
      <div class="form-group">
        <label>LOGO DEL BOX</label>
        <input type="file" id="boxLogoInput" accept="image/*" onchange="handleLogoUpload(event, 'box')">
      </div>
      <div class="form-group" style="margin-bottom: 0;">
        <label>LOGO PROGRAMMAZIONE</label>
        <input type="file" id="progLogoInput" accept="image/*" onchange="handleLogoUpload(event, 'prog')">
      </div>
    </div>
  </div>

  <!-- TAB STORICO -->
  <div id="tab-storico" class="tab-content">
    <div class="card">
      <div class="card-title">I TUOI ALLENAMENTI</div>
      <div id="historyList">Nessun allenamento salvato.</div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz-uccgu2EuyehI3kxqqIAfRmBRbNKR2Bhmty8QjsejKKqcgvYJB2M9ZwJ7SdoGQQmU-g/exec";

    let currentMode = 'RX';
    let detectedSetsCount = 0;

    const BODYWEIGHT_MOVEMENTS = [
      "Pull Ups", "Chest to Bar", "C2B", "Bar Muscle Up", "BMU", "Ring Muscle Up", "RMU", 
      "Toes to Bar", "T2B", "Knees to Elbows", "Ring Dips", "Dips", "Strict Pull Ups",
      "Handstand Push Ups", "HSPU", "Strict HSPU", "Handstand Walk", "Push Ups", "Burpees", 
      "Burpee Box Jump Over", "Pistols", "Single Leg Squat", "Sit Ups", "AbMat Sit Ups", 
      "V-Ups", "L-Sit", "Air Squat", "Double Unders", "DU", "Single Unders", 
      "Box Jumps", "Box Step Ups", "Tall Box Jumps", "Row", "Run", "Shuttle Run", 
      "Echo Bike", "Assault Bike", "BikeErg", "SkiErg", "Ski", "Rope Climb", "Legless Rope Climb", "Pegboard"
    ];

    const ALL_MOVEMENTS = [
      ...BODYWEIGHT_MOVEMENTS,
      "Power Snatch", "Hang Power Snatch", "Squat Snatch", "Hang Squat Snatch", "Snatch Balance", "Muscle Snatch", "Snatch Shrugs", "High Hang Snatch Shrugs", "Snatch",
      "Power Clean", "Hang Power Clean", "Squat Clean", "Hang Squat Clean", "Clean and Jerk", "Push Jerk", "Split Jerk", "Push Press", "Strict Press", "Shoulder Press", "Clean",
      "Back Squat", "Front Squat", "Overhead Squat", "OHS", "Deadlift", "Sumo Deadlift High Pull", "SDHP", "Thruster", "Cluster",
      "DB Snatch", "DB Clean", "DB Thruster", "DB Devil Press", "Devil Press", "DB Lunge", "KB Swing", "American KB Swing", "Russian KB Swing", "Goblet Squat", "Farmer Carry", "Turkish Get-Up", "Wall Balls", "Walking Lunge", "Overhead Lunge"
    ];

    window.onload = () => {
      document.getElementById('wodDate').valueAsDate = new Date();
      const savedName = localStorage.getItem('board_athlete_name') || '';
      document.getElementById('athleteName').value = savedName;
      document.getElementById('profileName').value = savedName;
      document.getElementById('profileWeight').value = localStorage.getItem('board_athlete_weight') || '';
      document.getElementById('profileHeight').value = localStorage.getItem('board_athlete_height') || '';
      document.getElementById('profileGender').value = localStorage.getItem('board_athlete_gender') || 'M';
      
      loadSavedLogos();
      renderResultFields();
    };

    function handleLogoUpload(event, type) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Image = e.target.result;
        if (type === 'box') {
          localStorage.setItem('board_box_logo', base64Image);
          showLogo('box', base64Image);
        } else {
          localStorage.setItem('board_prog_logo', base64Image);
          showLogo('prog', base64Image);
        }
      };
      reader.readAsDataURL(file);
    }

    function loadSavedLogos() {
      const savedBoxLogo = localStorage.getItem('board_box_logo');
      if (savedBoxLogo) showLogo('box', savedBoxLogo);

      const savedProgLogo = localStorage.getItem('board_prog_logo');
      if (savedProgLogo) showLogo('prog', savedProgLogo);
    }

    function showLogo(type, src) {
      const img = document.getElementById(type === 'box' ? 'boxLogoPreview' : 'progLogoPreview');
      if (img) {
        img.src = src;
        img.style.display = 'block';
      }
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btnRx').classList.toggle('active', mode === 'RX');
      document.getElementById('btnScaled').classList.toggle('active', mode === 'SCALED');
    }

    function switchTab(tab) {
      document.querySelectorAll('.nav button').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      if(tab === 'registra') {
        document.querySelector('.nav button:nth-child(1)').classList.add('active');
        document.getElementById('tab-registra').classList.add('active');
      } else if(tab === 'profilo') {
        document.querySelector('.nav button:nth-child(2)').classList.add('active');
        document.getElementById('tab-profilo').classList.add('active');
      } else {
        document.querySelector('.nav button:nth-child(3)').classList.add('active');
        document.getElementById('tab-storico').classList.add('active');
        renderHistory();
      }
    }

    function renderResultFields() {
      const type = document.getElementById('wodType').value;
      const container = document.getElementById('dynamicResultContainer');
      const label = document.getElementById('resultLabel');

      if (type === 'For Time') {
        label.innerText = 'SCORE (TIME)';
        container.innerHTML = `
          <div class="form-row">
            <input type="number" id="resMin" placeholder="mins">
            <input type="number" id="resSec" placeholder="secs">
          </div>
        `;
      } else if (type === 'AMRAP') {
        label.innerText = 'SCORE (ROUNDS + REPS)';
        container.innerHTML = `
          <div class="form-row">
            <input type="number" id="resRounds" placeholder="Rounds">
            <input type="number" id="resReps" placeholder="Reps">
          </div>
        `;
      } else if (type === 'Sets') {
        label.innerText = 'SCORE PER SET / MASSIMALE (KG / REPS)';
        let count = detectedSetsCount > 0 ? detectedSetsCount : 5;
        let html = '';
        for (let i = 1; i <= count; i++) {
          html += `
            <div class="set-row">
              <span class="set-number">${i}</span>
              <input type="text" class="set-input" placeholder="Carico / Esito set ${i}">
              <span class="set-label">reps/kg</span>
            </div>
          `;
        }
        container.innerHTML = html;
      } else if (type === 'EMOM') {
        label.innerText = 'SCORE (EMOM)';
        container.innerHTML = `
          <div class="form-row">
            <select id="resEmomStatus">
              <option value="Completato">Completato</option>
              <option value="Fallito">Fallito</option>
            </select>
            <input type="number" id="resEmomMin" placeholder="Minuto stop">
          </div>
        `;
      }
    }

    function addExerciseRow(reps = '', name = '', weight = '') {
      const container = document.getElementById('exercisesContainer');
      const row = document.createElement('div');

      const isBodyweight = BODYWEIGHT_MOVEMENTS.some(b => new RegExp(`\\b${b}\\b`, 'i').test(name));
      const showWeight = weight !== '' || (!isBodyweight && name !== '');

      row.className = `exercise-row ${showWeight ? 'has-weight' : ''}`;
      
      let html = `
        <input type="text" placeholder="Reps/Dist" value="${reps}">
        <input type="text" placeholder="Movimento" value="${name}" oninput="checkWeightVisibility(this)">
      `;

      if (showWeight) {
        html += `<input type="text" placeholder="Kg / lbs / %" value="${weight}">`;
      }

      html += `<button type="button" class="btn-remove" onclick="this.parentElement.remove()">✕</button>`;
      row.innerHTML = html;
      container.appendChild(row);
    }

    function checkWeightVisibility(input) {
      const row = input.parentElement;
      const name = input.value;
      const isBodyweight = BODYWEIGHT_MOVEMENTS.some(b => new RegExp(`\\b${b}\\b`, 'i').test(name));
      const hasWeightInput = row.querySelectorAll('input').length === 3;

      if (isBodyweight && hasWeightInput) {
        row.querySelectorAll('input')[2].remove();
        row.classList.remove('has-weight');
      } else if (!isBodyweight && name.length > 2 && !hasWeightInput) {
        const weightInput = document.createElement('input');
        weightInput.type = 'text';
        weightInput.placeholder = 'Kg / lbs / %';
        row.insertBefore(weightInput, row.children[2]);
        row.classList.add('has-weight');
      }
    }

    const imageInput = document.getElementById('imageInput');
    const status = document.getElementById('status');

    imageInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      status.innerText = 'Analisi screenshot in corso...';
      document.getElementById('exercisesContainer').innerHTML = '';
      detectedSetsCount = 0;

      try {
        const worker = await Tesseract.createWorker('eng');
        const ret = await worker.recognize(file);
        const text = ret.data.text;
        await worker.terminate();

        status.innerText = 'WOD importato con successo!';
        document.getElementById('wodNotes').value = text.trim();

        const numberListMatches = text.match(/^\s*([1-9])\s+(?=\w|\d)/gm);
        const selectType = document.getElementById('wodType');

        if (/For Time/i.test(text)) {
          selectType.value = 'For Time';
        } else if (/AMRAP/i.test(text)) {
          selectType.value = 'AMRAP';
        } else if (numberListMatches && numberListMatches.length > 3) {
          selectType.value = 'Sets';
          detectedSetsCount = numberListMatches.length;
        } else if (/1RM|@\d+%|sets|rest/i.test(text)) {
          selectType.value = 'Sets';
          const lineSets = text.split('\n').filter(l => /@\d+%/i.test(l));
          if (lineSets.length > 0) detectedSetsCount = lineSets.length;
        }

        renderResultFields();

        const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        if (lines.length > 0) {
          document.getElementById('wodTitle').value = lines[0].replace(/Score|Log Result/gi, '').substring(0, 35).trim();
        }

        lines.forEach(line => {
          if (/workout overview|look for|http|deload|options|public notes|private notes/i.test(line)) return;

          let matchedMovement = ALL_MOVEMENTS.find(m => new RegExp(`\\b${m}\\b`, 'i').test(line));

          if (matchedMovement) {
            let reps = '';
            let weight = '';
            const weightMatch = line.match(/(@?\d+[-%]*\d*%\s*\w*|\(\d+\/\d+\)|\d+\s*kg|\d+\s*lbs)/i);
            if (weightMatch) weight = weightMatch[0].trim();
            const repsMatch = line.match(/^(\d+\s*(m|Rounds|Sets|Reps)?)/i);
            if (repsMatch) reps = repsMatch[0].trim();

            addExerciseRow(reps, matchedMovement, weight);
          }
        });

        if (document.getElementById('exercisesContainer').children.length === 0) {
          addExerciseRow('', '', '');
        }

      } catch (err) {
        status.innerText = 'Errore durante la lettura dell\'immagine.';
      }
    });

    function getFormattedResult() {
      const type = document.getElementById('wodType').value;
      if (type === 'For Time') {
        const min = document.getElementById('resMin')?.value || '00';
        const sec = document.getElementById('resSec')?.value || '00';
        return `${min}:${sec.padStart(2, '0')}`;
      } else if (type === 'AMRAP') {
        const rounds = document.getElementById('resRounds')?.value || '0';
        const reps = document.getElementById('resReps')?.value || '0';
        return `${rounds} rounds + ${reps} reps`;
      } else if (type === 'Sets') {
        const inputs = document.querySelectorAll('.set-input');
        let results = [];
        inputs.forEach((input, index) => {
          if (input.value.trim() !== '') {
            results.push(`Set ${index + 1}: ${input.value}`);
          }
        });
        return results.join(', ');
      } else if (type === 'EMOM') {
        const status = document.getElementById('resEmomStatus')?.value;
        const min = document.getElementById('resEmomMin')?.value;
        return min ? `${status} (min ${min})` : status;
      }
      return '';
    }

    async function saveWod() {
      const athleteName = document.getElementById('athleteName').value.trim();
      if (!athleteName) {
        alert("Inserisci il nome dell'atleta prima di salvare!");
        return;
      }

      localStorage.setItem('board_athlete_name', athleteName);

      const type = document.getElementById('wodType').value;
      const title = document.getElementById('wodTitle').value;
      const score = getFormattedResult();
      const notes = document.getElementById('wodNotes').value;

      const btnSave = document.getElementById('btnSave');
      btnSave.innerText = "INVIO IN CORSO...";
      btnSave.disabled = true;

      const exerciseRows = document.querySelectorAll('.exercise-row');
      let exercisesList = [];
      exerciseRows.forEach(row => {
        const inputs = row.querySelectorAll('input');
        if(inputs[1] && inputs[1].value.trim() !== '') {
          exercisesList.push({
            reps: inputs[0].value,
            name: inputs[1].value,
            weight: inputs[2] ? inputs[2].value : ''
          });
        }
      });

      const fullNotes = `Movimenti:\n${exercisesList.map(ex => `${ex.reps} ${ex.name} ${ex.weight}`).join('\n')}\n\nNote:\n${notes}`;

      const payload = {
        azione: type === "Sets" ? "salva_pr" : "salva_wod",
        nome: athleteName,
        nomeWod: title || type,
        esercizio: title || "Massimale",
        score: score,
        peso: score,
        modalita: currentMode,
        note: fullNotes
      };

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        let history = JSON.parse(localStorage.getItem('board_history') || '[]');
        history.unshift({
          id: Date.now(),
          type: type,
          mode: currentMode,
          date: document.getElementById('wodDate').value,
          title: title,
          exercises: exercisesList,
          result: score,
          notes: notes
        });
        localStorage.setItem('board_history', JSON.stringify(history));

        alert("Allenamento salvato con successo su Cloud!");
        document.getElementById('wodTitle').value = '';
        document.getElementById('wodNotes').value = '';
        document.getElementById('exercisesContainer').innerHTML = '';
        document.getElementById('status').innerText = '';
        renderResultFields();
      } catch (e) {
        alert("Errore durante l'invio su Cloud: " + e.message);
      } finally {
        btnSave.innerText = "SALVA E INVIA A CLOUD";
        btnSave.disabled = false;
      }
    }

    async function saveProfile() {
      const name = document.getElementById('profileName').value.trim();
      const weight = document.getElementById('profileWeight').value;
      const height = document.getElementById('profileHeight').value;
      const gender = document.getElementById('profileGender').value;

      if (!name) {
        alert("Inserisci il nome!");
        return;
      }

      localStorage.setItem('board_athlete_name', name);
      localStorage.setItem('board_athlete_weight', weight);
      localStorage.setItem('board_athlete_height', height);
      localStorage.setItem('board_athlete_gender', gender);
      document.getElementById('athleteName').value = name;

      const payload = {
        azione: "salva_profilo",
        nome: name,
        sesso: gender,
        peso: weight,
        altezza: height
      };

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        alert("Profilo aggiornato sul Cloud!");
      } catch (e) {
        alert("Errore durante il salvataggio del profilo.");
      }
    }

    function renderHistory() {
      const historyList = document.getElementById('historyList');
      let history = JSON.parse(localStorage.getItem('board_history') || '[]');

      if (history.length === 0) {
        historyList.innerHTML = '<p style="color:var(--text-muted)">Nessun salvataggio trovato.</p>';
        return;
      }

      historyList.innerHTML = history.map(item => `
        <div class="history-item">
          <div style="font-size:11px; color:var(--accent); font-weight:800;">
            ${item.type} • ${item.mode || 'RX'} • ${item.date}
          </div>
          <div style="font-size:16px; font-weight:700; margin:4px 0;">${item.title || 'Senza Titolo'}</div>
          ${item.exercises && item.exercises.length > 0 ? `
            <ul style="padding-left:18px; margin:8px 0; font-size:13px; color:#ddd;">
              ${item.exercises.map(ex => `<li><strong>${ex.reps}</strong> ${ex.name} ${ex.weight ? `<em>(${ex.weight})</em>` : ''}</li>`).join('')}
            </ul>
          ` : ''}
          ${item.result ? `<div style="color:var(--success); font-weight:700; font-size:13px;">Risultato: ${item.result}</div>` : ''}
          ${item.notes ? `<div style="font-size:12px; color:var(--text-muted); margin-top:4px; white-space: pre-wrap;">${item.notes}</div>` : ''}
        </div>
      `).join('');
    }
  </script>
</body>
</html>
