<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Board</title>
<style>
:root{
  --charcoal:#15171A;
  --panel:#1E2124;
  --panel-2:#25292D;
  --steel:#4A5560;
  --line:#33383D;
  --chalk:#EDEAE1;
  --chalk-dim:#9A9E96;
  --rust:#D9531E;
  --rust-dim:#7A3216;
  --olive:#8A9A5B;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:transparent;}
body{
  font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
  color:var(--chalk);
  background:var(--charcoal);
  min-height:100vh;
}
.app{max-width:760px;margin:0 auto;padding:20px 16px 60px;}

.board-header{
  display:flex;justify-content:space-between;align-items:flex-end;
  border-bottom:3px solid var(--rust);
  padding-bottom:12px;margin-bottom:18px;
}
.board-header h1{
  font-family:'Arial Black',Impact,sans-serif;
  font-size:28px;letter-spacing:0.5px;margin:0;
  text-transform:uppercase;
}
.board-header .sub{color:var(--chalk-dim);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;}

.tabs{display:flex;gap:2px;margin-bottom:18px;background:var(--panel);border-radius:6px;padding:3px;overflow-x:auto;}
.tab{
  flex:1;text-align:center;padding:9px 4px;font-size:11px;letter-spacing:0.6px;white-space:nowrap;
  text-transform:uppercase;font-weight:700;color:var(--chalk-dim);
  border-radius:5px;cursor:pointer;user-select:none;transition:all .15s;
}
.tab.active{background:var(--rust);color:#fff;}

.card{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:16px;margin-bottom:14px;
}
.card h2{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--chalk-dim);margin:0 0 12px;font-weight:700;}

label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:0.8px;color:var(--chalk-dim);margin-bottom:5px;margin-top:12px;font-weight:700;}
label:first-child{margin-top:0;}
input,select,textarea{
  width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--chalk);
  padding:9px 10px;border-radius:5px;font-family:inherit;font-size:14px;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--rust);}
textarea{resize:vertical;min-height:44px;}

.row{display:flex;gap:10px;}
.row > *{flex:1;}

button.primary{
  margin-top:16px;width:100%;background:var(--rust);color:#fff;border:none;
  padding:11px;border-radius:5px;font-weight:700;text-transform:uppercase;letter-spacing:1px;
  font-size:13px;cursor:pointer;font-family:inherit;
}
button.primary:hover{background:#c44a1a;}
button.primary:disabled{background:var(--steel);cursor:not-allowed;}

button.secondary{
  margin-top:10px;width:100%;background:var(--panel-2);color:var(--chalk-dim);border:1px solid var(--line);
  padding:9px;border-radius:5px;font-weight:700;text-transform:uppercase;letter-spacing:1px;
  font-size:12px;cursor:pointer;font-family:inherit;
}
button.secondary:hover{color:var(--chalk);border-color:var(--rust);}

button.ghost{
  background:var(--panel-2);color:var(--chalk-dim);border:1px dashed var(--steel);
  padding:8px;border-radius:5px;font-size:12px;cursor:pointer;width:100%;margin-top:8px;
  text-transform:uppercase;letter-spacing:0.6px;font-weight:700;
}
button.ghost:hover{color:var(--chalk);border-color:var(--rust);}

.mv-row{display:flex;gap:6px;align-items:flex-end;margin-top:8px;}
.mv-row .mv-name{flex:2;}
.mv-row .mv-num{flex:1;}
.mv-row .mv-del{flex:0 0 auto;background:none;border:none;color:var(--steel);font-size:18px;cursor:pointer;padding:0 4px;height:37px;}
.mv-row .mv-del:hover{color:var(--rust);}
.mv-row label{display:none;}

.ticker{
  display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;
  scrollbar-width:thin;
}
.plate{
  flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--rust);
  border-radius:6px;padding:10px 14px;min-width:110px;
}
.plate .name{font-size:10px;text-transform:uppercase;color:var(--chalk-dim);letter-spacing:0.6px;font-weight:700;}
.plate .val{font-family:'Arial Black',Impact,sans-serif;font-size:22px;margin-top:2px;}
.plate .val span{font-size:12px;color:var(--chalk-dim);font-family:inherit;}

.day-group{margin-bottom:18px;}
.day-header{
  display:flex;align-items:baseline;gap:8px;margin-bottom:8px;padding-bottom:6px;
  border-bottom:2px solid var(--line);
}
.day-header .d-date{font-family:'Arial Black',Impact,sans-serif;font-size:15px;text-transform:uppercase;}
.day-header .d-count{font-size:11px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:0.5px;}

.entry{
  padding:11px 4px;border-bottom:1px solid var(--line);
}
.entry:last-child{border-bottom:none;}
.entry-top{display:flex;justify-content:space-between;align-items:center;}
.entry .left .name{font-weight:700;font-size:14px;}
.entry .left .meta{font-size:11px;color:var(--chalk-dim);margin-top:2px;}
.entry .right{text-align:right;}
.entry .right .score{font-family:'Arial Black',Impact,sans-serif;font-size:16px;}
.entry .right .date{font-size:10px;color:var(--chalk-dim);text-transform:uppercase;}
.entry .movements{font-size:11px;color:var(--chalk-dim);margin-top:5px;line-height:1.5;}
.modality-badge{display:inline-block;background:var(--panel-2);border:1px solid var(--line);color:var(--olive);
  font-size:9px;font-weight:700;padding:1px 6px;border-radius:3px;margin-left:6px;letter-spacing:0.5px;vertical-align:middle;text-transform:uppercase;}
.pr-badge{display:inline-block;background:var(--rust);color:#fff;font-size:9px;font-weight:700;
  padding:1px 6px;border-radius:3px;margin-left:6px;letter-spacing:0.5px;vertical-align:middle;}
.del{background:none;border:none;color:var(--steel);cursor:pointer;font-size:16px;padding:0 0 0 10px;}
.del:hover{color:var(--rust);}

.empty{color:var(--chalk-dim);font-size:13px;text-align:center;padding:24px 0;}

.exercise-select{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.chip{
  background:var(--panel);border:1px solid var(--line);color:var(--chalk-dim);
  padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer;font-weight:700;
}
.chip.active{background:var(--olive);border-color:var(--olive);color:#111;}

.chart-wrap{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;}
.chart-title{font-family:'Arial Black',Impact,sans-serif;font-size:16px;margin-bottom:4px;text-transform:uppercase;}
.chart-current{color:var(--chalk-dim);font-size:12px;margin-bottom:10px;}
.chart-current b{color:var(--rust);font-family:inherit;}

.status{font-size:11px;color:var(--chalk-dim);text-align:center;margin-top:10px;min-height:14px;}

.import-box{
  background:var(--panel-2);border:1px dashed var(--steel);border-radius:6px;
  padding:12px;margin-bottom:14px;text-align:center;
}
.import-box.busy{border-color:var(--rust);}
.import-label{
  display:inline-block;background:var(--olive);color:#111;font-weight:700;font-size:12px;
  text-transform:uppercase;letter-spacing:0.6px;padding:8px 16px;border-radius:5px;cursor:pointer;
}
.import-label input{display:none;}
.import-status{font-size:11px;color:var(--chalk-dim);margin-top:8px;min-height:14px;}

.pending-card{
  background:var(--panel-2);border:1px solid var(--line);border-left:4px solid var(--olive);
  border-radius:6px;padding:12px;margin-bottom:10px;
}
.pending-card .pc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.pending-card .pc-type{font-size:10px;text-transform:uppercase;letter-spacing:0.6px;color:var(--olive);font-weight:700;}
.pending-card .pc-del{background:none;border:none;color:var(--steel);font-size:18px;cursor:pointer;}
.pending-card .pc-del:hover{color:var(--rust);}
.pending-card label{font-size:9px;margin-top:8px;margin-bottom:3px;}
.pending-card input,.pending-card select,.pending-card textarea{font-size:13px;padding:7px 8px;}

.athlete-box{
  background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:14px;
  display:flex;gap:8px;align-items:center;
}
.athlete-box input{flex:1;}
.athlete-box .lbl{font-size:11px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:0.6px;font-weight:700;white-space:nowrap;}

.share-row{display:flex;align-items:center;gap:8px;margin-top:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:9px 10px;}
.share-row input[type=checkbox]{width:auto;flex:0 0 auto;}
.share-row select{flex:0 0 110px;}
.share-row .share-label{flex:1;font-size:12px;color:var(--chalk-dim);}

.wod-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.wod-list-item{
  background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;
  cursor:pointer;display:flex;justify-content:space-between;align-items:center;
}
.wod-list-item:hover{border-color:var(--rust);}
.wod-list-item .wl-name{font-weight:700;font-size:13px;}
.wod-list-item .wl-count{font-size:11px;color:var(--chalk-dim);}

.lb-filters{display:flex;gap:6px;margin-bottom:12px;}
.lb-row{
  display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid var(--line);
}
.lb-row.me{background:rgba(217,83,30,0.12);border-radius:6px;}
.lb-row .lb-rank{font-family:'Arial Black',Impact,sans-serif;font-size:15px;width:34px;color:var(--chalk-dim);}
.lb-row.rank-1 .lb-rank{color:#E8C468;}
.lb-row.rank-2 .lb-rank{color:#C9CDD3;}
.lb-row.rank-3 .lb-rank{color:#C87F4A;}
.lb-row .lb-athlete{flex:1;font-weight:700;font-size:13px;}
.lb-row .lb-athlete .lb-date{display:block;font-weight:400;font-size:10px;color:var(--chalk-dim);text-transform:uppercase;}
.lb-row .lb-score{font-family:'Arial Black',Impact,sans-serif;font-size:15px;}
.lb-summary{font-size:12px;color:var(--chalk-dim);margin-bottom:10px;}
.lb-summary b{color:var(--rust);font-family:inherit;}
.rx-badge{display:inline-block;font-size:9px;font-weight:700;padding:1px 6px;border-radius:3px;margin-left:6px;letter-spacing:0.5px;}
.rx-badge.rx{background:var(--olive);color:#111;}
.rx-badge.scaled{background:var(--steel);color:#fff;}
</style>
</head>
<body>
<div id="root" class="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const { useState, useEffect, useMemo, useCallback } = React;
const e = React.createElement;

const MOVEMENTS = [
"Air Squat","Back Squat","Front Squat","Overhead Squat","Pistol Squat","Goblet Squat",
"Deadlift","Sumo Deadlift High Pull","Romanian Deadlift",
"Clean","Power Clean","Squat Clean","Hang Clean","Hang Power Clean",
"Snatch","Power Snatch","Squat Snatch","Hang Snatch","Hang Power Snatch",
"Clean & Jerk","Push Press","Push Jerk","Split Jerk","Strict Press","Bench Press","Thruster","Sots Press",
"Pull-up","Chest-to-Bar Pull-up","Strict Pull-up","Kipping Pull-up","Muscle-up (Ring)","Muscle-up (Bar)",
"Handstand Push-up","Strict HSPU","Handstand Walk","Toes-to-Bar","Knees-to-Elbows","Ring Dip","Push-up",
"Burpee","Burpee Box Jump Over","Burpee Pull-up","Box Jump","Box Jump Over","Rope Climb","Wall Ball",
"GHD Sit-up","L-sit","Sit-up","Jumping Lunge","Walking Lunge","Kettlebell Swing","Turkish Get-up",
"Run","Row","Bike (Assault/Echo)","Ski Erg","Double Under","Single Under","Swim","Farmer Carry","Sled Push/Pull"
];

const WOD_MODALITIES = ["For Time","AMRAP","EMOM","Tabata","Interval (Every X min)","Chipper","Ladder","Max Load","Max Reps","Custom"];
const BENCHMARK_WODS = ["Fran","Grace","Helen","Diane","Cindy","Murph","Karen","Isabel","Angie","Annie","Elizabeth","Kelly","Nancy","Nicole","Jackie","DT"];

const TIME_MODALITIES = ["For Time","Chipper","Ladder"];
const ROUNDS_REPS_MODALITIES = ["AMRAP"];
const INTERVAL_MODALITIES = ["EMOM","Tabata","Interval (Every X min)"];

function fmtDate(d){
  const dt = new Date(d);
  return dt.toLocaleDateString('it-IT',{day:'2-digit',month:'short'});
}
function fmtDayHeader(d){
  const dt = new Date(d);
  return dt.toLocaleDateString('it-IT',{weekday:'short', day:'2-digit', month:'short', year:'numeric'});
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function emptyMovementRow(){ return {id:uid(),movement:'',reps:'',weight:''}; }

function App(){
  const [entries,setEntries] = useState([]);
  const [loaded,setLoaded] = useState(false);
  const [tab,setTab] = useState('log');
  const [status,setStatus] = useState('');
  const [selectedExercise,setSelectedExercise] = useState(null);

  const [kind,setKind] = useState('lift');
  const [date,setDate] = useState(new Date().toISOString().slice(0,10));
  const [notes,setNotes] = useState('');

  // lift fields
  const [liftName,setLiftName] = useState('');
  const [weight,setWeight] = useState('');
  const [reps,setReps] = useState('');

  // wod fields
  const [wodName,setWodName] = useState('');
  const [modality,setModality] = useState('For Time');
  const [movements,setMovements] = useState([emptyMovementRow()]);
  const [scoreTime,setScoreTime] = useState('');
  const [scoreRounds,setScoreRounds] = useState('');
  const [scoreExtraReps,setScoreExtraReps] = useState('');
  const [scoreLoad,setScoreLoad] = useState('');
  const [category,setCategory] = useState('Rx');
  const [shareToLB,setShareToLB] = useState(true);

  // athlete identity + leaderboard
  const [athleteName,setAthleteName] = useState('');
  const [athleteInput,setAthleteInput] = useState('');
  const [lbIndex,setLbIndex] = useState([]);
  const [lbSelected,setLbSelected] = useState(null);
  const [lbResults,setLbResults] = useState([]);
  const [lbFilter,setLbFilter] = useState('all');
  const [lbBusy,setLbBusy] = useState(false);
  const [lbMsg,setLbMsg] = useState('');

  // photo import
  const [importBusy,setImportBusy] = useState(false);
  const [importMsg,setImportMsg] = useState('');
  const [pendingBlocks,setPendingBlocks] = useState([]);
  const [pendingDate,setPendingDate] = useState(new Date().toISOString().slice(0,10));

  useEffect(()=>{
    (async()=>{
      try{
        const res = await window.storage.get('crossfit-entries', false);
        if(res && res.value){
          setEntries(JSON.parse(res.value));
        }
      }catch(err){}
      try{
        const prof = await window.storage.get('athlete-profile', false);
        if(prof && prof.value){
          const p = JSON.parse(prof.value);
          setAthleteName(p.name||'');
          setAthleteInput(p.name||'');
        }
      }catch(err){}
      try{
        const idx = await window.storage.get('lb-index', true);
        if(idx && idx.value) setLbIndex(JSON.parse(idx.value));
      }catch(err){}
      setLoaded(true);
    })();
  },[]);

  const saveAthleteName = async ()=>{
    const nm = athleteInput.trim();
    if(!nm) return;
    setAthleteName(nm);
    try{
      await window.storage.set('athlete-profile', JSON.stringify({name:nm}), false);
    }catch(err){}
  };

  const persist = useCallback(async(next)=>{
    setEntries(next);
    try{
      await window.storage.set('crossfit-entries', JSON.stringify(next), false);
      setStatus('Salvato');
      setTimeout(()=>setStatus(''),1200);
    }catch(err){
      setStatus('Errore nel salvataggio');
    }
  },[]);

  const resetWodForm = ()=>{
    setWodName('');setModality('For Time');
    setMovements([emptyMovementRow()]);
    setScoreTime('');setScoreRounds('');setScoreExtraReps('');setScoreLoad('');setNotes('');
  };

  const addEntry = ()=>{
    if(kind==='lift'){
      const nm = liftName.trim();
      if(!nm || !weight) return;
      const entry = {
        id: uid(), kind:'lift', name: nm, date,
        weight: Number(weight), reps: reps? Number(reps): null,
        notes: notes.trim() || null, createdAt: Date.now()
      };
      persist([entry, ...entries]);
      setLiftName('');setWeight('');setReps('');setNotes('');
    } else {
      const nm = wodName.trim();
      const cleanMovements = movements.filter(m=>m.movement.trim());
      if(!nm && cleanMovements.length===0) return;
      const entry = {
        id: uid(), kind:'wod', name: nm || modality, modality, date, category,
        movements: cleanMovements.map(m=>({movement:m.movement.trim(), reps:m.reps||null, weight:m.weight||null})),
        scoreTime: TIME_MODALITIES.includes(modality) ? (scoreTime||null) : null,
        scoreRounds: (ROUNDS_REPS_MODALITIES.includes(modality)||INTERVAL_MODALITIES.includes(modality)) ? (scoreRounds? Number(scoreRounds):null) : null,
        scoreExtraReps: (ROUNDS_REPS_MODALITIES.includes(modality)||INTERVAL_MODALITIES.includes(modality)||modality==='Max Reps') ? (scoreExtraReps? Number(scoreExtraReps):null) : null,
        scoreLoad: modality==='Max Load' ? (scoreLoad? Number(scoreLoad):null) : null,
        scoreMaxReps: modality==='Max Reps' ? (scoreExtraReps? Number(scoreExtraReps):null) : null,
        notes: notes.trim() || null, createdAt: Date.now()
      };
      persist([entry, ...entries]);
      if(shareToLB && athleteName){
        const score = scoreForShare(modality, scoreTime, scoreRounds, scoreExtraReps, scoreLoad);
        if(score) shareResultToLeaderboard(nm, modality, score, category, date, notes.trim()||null);
      }
      resetWodForm();
    }
  };

  const removeEntry = (id)=>{ persist(entries.filter(en=>en.id!==id)); };

  // ---------- leaderboard ----------
  const workoutKey = (nm, mod)=> (nm||mod||'wod').trim().toLowerCase().replace(/\s+/g,'-')+'|'+(mod||'').trim().toLowerCase().replace(/\s+/g,'-');

  const parseTimeToSeconds = (t)=>{
    if(!t) return null;
    const m = t.trim().match(/^(\d+):(\d{1,2})$/);
    if(!m) return null;
    return parseInt(m[1],10)*60 + parseInt(m[2],10);
  };

  const scoreForShare = (mod, sTime, sRounds, sExtraReps, sLoad)=>{
    if(TIME_MODALITIES.includes(mod)){
      const secs = parseTimeToSeconds(sTime);
      if(secs==null) return null;
      return {type:'time', better:'lower', value:secs, display:sTime};
    }
    if(mod==='AMRAP' || INTERVAL_MODALITIES.includes(mod)){
      if(sRounds===''||sRounds==null) return null;
      const r = Number(sRounds), er = sExtraReps? Number(sExtraReps):0;
      return {type:'rounds', better:'higher', value:r*10000+er, display: r+' round'+(er?' +'+er+' rip':'')};
    }
    if(mod==='Max Load'){
      if(!sLoad) return null;
      return {type:'load', better:'higher', value:Number(sLoad), display:sLoad+' kg'};
    }
    if(mod==='Max Reps'){
      if(!sExtraReps) return null;
      return {type:'reps', better:'higher', value:Number(sExtraReps), display:sExtraReps+' rip'};
    }
    return null;
  };

  const shareResultToLeaderboard = async (nm, mod, score, cat, date, notes)=>{
    if(!athleteName || !score) return;
    const key = workoutKey(nm, mod);
    try{
      let idx = lbIndex;
      if(!idx.some(w=>w.key===key)){
        idx = [...idx, {key, name: nm||mod, modality: mod}];
        try{ await window.storage.set('lb-index', JSON.stringify(idx), true); setLbIndex(idx); }catch(err){}
      }
      let list = [];
      try{
        const res = await window.storage.get('lb:'+key, true);
        if(res && res.value) list = JSON.parse(res.value);
      }catch(err){}
      list = list.filter(r=>r.athlete!==athleteName);
      list.push({id:uid(), athlete:athleteName, date, category:cat, scoreType:score.type, scoreValue:score.value, scoreDisplay:score.display, notes: notes||null});
      await window.storage.set('lb:'+key, JSON.stringify(list), true);
    }catch(err){}
  };

  const loadLeaderboard = async (w)=>{
    setLbSelected(w);
    setLbBusy(true);
    setLbMsg('');
    try{
      const res = await window.storage.get('lb:'+w.key, true);
      const list = (res && res.value) ? JSON.parse(res.value) : [];
      setLbResults(list);
    }catch(err){
      setLbResults([]);
      setLbMsg('Nessun risultato ancora per questo workout.');
    }
    setLbBusy(false);
  };

  const updateMovementRow = (id, field, val)=>{
    setMovements(movements.map(m=> m.id===id? {...m,[field]:val} : m));
  };
  const addMovementRow = ()=> setMovements([...movements,emptyMovementRow()]);
  const removeMovementRow = (id)=> setMovements(movements.length>1 ? movements.filter(m=>m.id!==id) : movements);

  // ---------- photo import (multi-file, multi-block) ----------
  const resizeAndEncode = (file)=> new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 1000;
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width*scale);
        canvas.height = Math.round(img.height*scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        const dataUrl = canvas.toDataURL('image/jpeg',0.82);
        resolve({dataUrl, base64: dataUrl.split(',')[1]});
      };
      img.onerror = ()=>reject(new Error('immagine non valida'));
      img.src = reader.result;
    };
    reader.onerror = ()=>reject(new Error('lettura file fallita'));
    reader.readAsDataURL(file);
  });

  const blockFromParsedLift = (p)=> ({
    id:uid(), type:'lift',
    name: p.name||'', weight: p.weight!=null? String(p.weight):'', reps: p.reps!=null? String(p.reps):'',
    notes: p.notes||''
  });
  const blockFromParsedWod = (p)=> ({
    id:uid(), type:'wod',
    wodName: p.wodName||'',
    modality: WOD_MODALITIES.includes(p.modality) ? p.modality : 'Custom',
    movements: (Array.isArray(p.movements) && p.movements.length ? p.movements : [{}]).map(m=>({
      id:uid(), movement:m.movement||'', reps:(m.reps!=null&&m.reps!=='')?String(m.reps):'', weight:(m.weight!=null&&m.weight!=='')?String(m.weight):''
    })),
    scoreTime: p.scoreTime||'',
    scoreRounds: p.scoreRounds!=null? String(p.scoreRounds):'',
    scoreExtraReps: p.scoreExtraReps!=null? String(p.scoreExtraReps):'',
    scoreLoad: p.scoreLoad!=null? String(p.scoreLoad):'',
    notes: p.notes||''
  });

  const parsePhotoToBlocks = async (file)=>{
    const {base64} = await resizeAndEncode(file);
    const prompt = "Guarda questa foto del programma di allenamento CrossFit di oggi (lavagna, quaderno, schermo di un'app). "+
      "Nella stessa foto possono esserci PIÙ parti/lavori distinti (es. riscaldamento, forza, un WOD, un accessorio): estrai OGNI parte come un blocco separato. "+
      "Rispondi ESCLUSIVAMENTE con un array JSON valido, senza testo prima o dopo, senza backtick. Ogni elemento dell'array ha uno di questi due schemi:\n"+
      'Alzata/lavoro di forza: {"type":"lift","name": stringa (movimento, es. Back Squat), "weight": numero (kg) o null, "reps": numero o null, "notes": stringa o null}\n'+
      'WOD/metcon: {"type":"wod","wodName": stringa o null, "modality": una tra "For Time","AMRAP","EMOM","Tabata","Interval (Every X min)","Chipper","Ladder","Max Load","Max Reps","Custom", "movements":[{"movement":stringa, "reps":stringa o null, "weight":stringa o null}], "scoreTime": stringa mm:ss o null, "scoreRounds": numero o null, "scoreExtraReps": numero o null, "scoreLoad": numero o null, "notes": stringa o null}\n'+
      "Se non è chiaramente indicata la modalità usa \"Custom\". Se non è visibile un risultato scritto a mano lascia i punteggi a null. Se la foto mostra un solo lavoro, restituisci comunque un array con un solo elemento.";
    const response = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:1500,
        messages:[{
          role:"user",
          content:[
            {type:"image", source:{type:"base64", media_type:"image/jpeg", data:base64}},
            {type:"text", text: prompt}
          ]
        }]
      })
    });
    const data = await response.json();
    const textBlock = (data.content||[]).find(c=>c.type==='text');
    let raw = textBlock ? textBlock.text : '';
    raw = raw.replace(/```json|```/g,'').trim();
    const parsedArr = JSON.parse(raw);
    if(!Array.isArray(parsedArr)) throw new Error('formato inatteso');
    return parsedArr.map(p=> p.type==='lift' ? blockFromParsedLift(p) : blockFromParsedWod(p));
  };

  const handleFilesSelected = async (fileList)=>{
    const files = Array.from(fileList||[]);
    if(files.length===0) return;
    setImportBusy(true);
    let totalFound = 0, failedCount = 0;
    for(let i=0;i<files.length;i++){
      setImportMsg(`Analisi foto ${i+1} di ${files.length}...`);
      try{
        const blocks = await parsePhotoToBlocks(files[i]);
        totalFound += blocks.length;
        setPendingBlocks(prev=>[...prev, ...blocks]);
      }catch(err){
        failedCount++;
      }
    }
    setImportBusy(false);
    if(failedCount>0 && totalFound>0){
      setImportMsg(`Trovati ${totalFound} lavori. ${failedCount} foto non lette, riprova con più luce.`);
    } else if(failedCount>0){
      setImportMsg('Non sono riuscito a leggere le foto. Riprova con più luce o inserisci a mano.');
    } else {
      setImportMsg(`Trovati ${totalFound} lavori — controllali qui sotto e salva.`);
    }
  };

  const updatePendingBlock = (blockId, field, val)=>{
    setPendingBlocks(prev=> prev.map(b=> b.id===blockId? {...b,[field]:val} : b));
  };
  const removePendingBlock = (blockId)=> setPendingBlocks(prev=> prev.filter(b=>b.id!==blockId));
  const updatePendingMovement = (blockId, movId, field, val)=>{
    setPendingBlocks(prev=> prev.map(b=>{
      if(b.id!==blockId) return b;
      return {...b, movements: b.movements.map(m=> m.id===movId? {...m,[field]:val} : m)};
    }));
  };
  const addPendingMovementRow = (blockId)=>{
    setPendingBlocks(prev=> prev.map(b=> b.id===blockId? {...b, movements:[...b.movements, emptyMovementRow()]} : b));
  };
  const removePendingMovementRow = (blockId, movId)=>{
    setPendingBlocks(prev=> prev.map(b=>{
      if(b.id!==blockId) return b;
      return b.movements.length>1 ? {...b, movements: b.movements.filter(m=>m.id!==movId)} : b;
    }));
  };

  const saveAllPending = ()=>{
    const created = [];
    pendingBlocks.forEach(b=>{
      if(b.type==='lift'){
        const nm = (b.name||'').trim();
        if(!nm || !b.weight) return;
        created.push({
          id:uid(), kind:'lift', name:nm, date: pendingDate,
          weight:Number(b.weight), reps: b.reps? Number(b.reps): null,
          notes: (b.notes||'').trim() || null, createdAt: Date.now()
        });
      } else {
        const nm = (b.wodName||'').trim();
        const cleanMovements = b.movements.filter(m=>m.movement.trim());
        if(!nm && cleanMovements.length===0) return;
        created.push({
          id:uid(), kind:'wod', name: nm || b.modality, modality: b.modality, date: pendingDate,
          movements: cleanMovements.map(m=>({movement:m.movement.trim(), reps:m.reps||null, weight:m.weight||null})),
          scoreTime: TIME_MODALITIES.includes(b.modality) ? (b.scoreTime||null) : null,
          scoreRounds: (ROUNDS_REPS_MODALITIES.includes(b.modality)||INTERVAL_MODALITIES.includes(b.modality)) ? (b.scoreRounds? Number(b.scoreRounds):null) : null,
          scoreExtraReps: (ROUNDS_REPS_MODALITIES.includes(b.modality)||INTERVAL_MODALITIES.includes(b.modality)||b.modality==='Max Reps') ? (b.scoreExtraReps? Number(b.scoreExtraReps):null) : null,
          scoreLoad: b.modality==='Max Load' ? (b.scoreLoad? Number(b.scoreLoad):null) : null,
          scoreMaxReps: b.modality==='Max Reps' ? (b.scoreExtraReps? Number(b.scoreExtraReps):null) : null,
          notes: (b.notes||'').trim() || null, createdAt: Date.now()
        });
      }
    });
    if(created.length===0){ setImportMsg('Nessun lavoro valido da salvare — completa almeno un nome/peso.'); return; }
    persist([...created, ...entries]);
    setPendingBlocks([]);
    setImportMsg(`Salvati ${created.length} lavori del ${fmtDate(pendingDate)}.`);
  };

  const discardPending = ()=>{ setPendingBlocks([]); setImportMsg(''); };

  // ---------- derived data ----------
  const lifts = useMemo(()=> entries.filter(en=>en.kind==='lift'),[entries]);

  const prList = useMemo(()=>{
    const map = {};
    lifts.forEach(l=>{
      if(l.weight==null) return;
      if(!map[l.name] || l.weight > map[l.name].weight) map[l.name]=l;
    });
    return Object.values(map).sort((a,b)=>b.weight-a.weight);
  },[lifts]);

  const exerciseNames = useMemo(()=> Array.from(new Set(lifts.map(l=>l.name))),[lifts]);

  useEffect(()=>{
    if((!selectedExercise || !exerciseNames.includes(selectedExercise)) && exerciseNames.length) setSelectedExercise(exerciseNames[0]);
  },[exerciseNames, selectedExercise]);

  const history = useMemo(()=>{
    if(!selectedExercise) return [];
    return lifts.filter(l=>l.name===selectedExercise && l.weight!=null)
      .slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
  },[lifts, selectedExercise]);

  const isPR = (l)=>{
    if(l.weight==null) return false;
    const prior = lifts.filter(x=>x.name===l.name && x.date<=l.date && x.id!==l.id);
    return !prior.some(x=>x.weight>=l.weight);
  };

  const groupedByDate = useMemo(()=>{
    const map = {};
    entries.forEach(en=>{ (map[en.date] = map[en.date] || []).push(en); });
    return Object.keys(map).sort((a,b)=> b.localeCompare(a)).map(d=> ({
      date:d, items: map[d].slice().sort((a,b)=> b.createdAt-a.createdAt)
    }));
  },[entries]);

  const renderChart = ()=>{
    if(history.length<2){
      return e('div',{className:'empty'}, 'Servono almeno 2 misurazioni per vedere il grafico.');
    }
    const w=680,hgt=180,pad=28;
    const vals = history.map(h=>h.weight);
    const min = Math.min(...vals), max = Math.max(...vals);
    const range = (max-min)||1;
    const step = history.length>1 ? (w-pad*2)/(history.length-1) : 0;
    const pts = history.map((h,i)=>{
      const x = pad + i*step;
      const y = pad + (hgt-pad*2) - ((h.weight-min)/range)*(hgt-pad*2);
      return {x,y,h};
    });
    const pathD = pts.map((p,i)=> (i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
    return e('svg',{viewBox:`0 0 ${w} ${hgt}`,width:'100%',height:'auto'},
      e('path',{d:pathD, fill:'none', stroke:'#D9531E', strokeWidth:2.5}),
      pts.map((p,i)=> e('g',{key:i},
        e('circle',{cx:p.x,cy:p.y,r:4,fill: (p.h.weight===max)?'#D9531E':'#8A9A5B'}),
        e('text',{x:p.x,y:p.y-10,fontSize:10,fill:'#EDEAE1',textAnchor:'middle'}, p.h.weight),
        e('text',{x:p.x,y:hgt-6,fontSize:9,fill:'#9A9E96',textAnchor:'middle'}, fmtDate(p.h.date))
      ))
    );
  };

  const wodScoreLabel = (en)=>{
    if(TIME_MODALITIES.includes(en.modality)) return en.scoreTime || '-';
    if(en.modality==='AMRAP') return (en.scoreRounds!=null? en.scoreRounds+' round':'-') + (en.scoreExtraReps? ' +'+en.scoreExtraReps+' rip':'');
    if(INTERVAL_MODALITIES.includes(en.modality)) return ((en.scoreRounds!=null? en.scoreRounds+' round':'') + (en.scoreExtraReps!=null? ' · '+en.scoreExtraReps+' rip':'')) || '-';
    if(en.modality==='Max Load') return en.scoreLoad!=null? en.scoreLoad+' kg':'-';
    if(en.modality==='Max Reps') return en.scoreMaxReps!=null? en.scoreMaxReps+' rip':'-';
    return '-';
  };

  const renderEntryRow = (en)=> e('div',{className:'entry', key:en.id},
    e('div',{className:'entry-top'},
      e('div',{className:'left'},
        e('div',{className:'name'}, en.name,
          en.kind==='lift' && isPR(en) && e('span',{className:'pr-badge'},'PR'),
          en.kind==='wod' && e('span',{className:'modality-badge'}, en.modality)
        ),
        en.kind==='lift' && e('div',{className:'meta'}, en.reps? en.reps+' rip' : '', en.notes ? ' · '+en.notes : '')
      ),
      e('div',{className:'right'},
        e('div',{className:'score'}, en.kind==='lift' ? (en.weight+' kg') : wodScoreLabel(en)),
        e('div',{className:'date'}, fmtDate(en.date))
      )
    ),
    en.kind==='wod' && en.movements && en.movements.length>0 && e('div',{className:'movements'},
      en.movements.map(m=> [m.reps, m.movement, m.weight?('@'+m.weight+'kg'):''].filter(Boolean).join(' ')).join(' · ')
    ),
    en.kind==='wod' && en.notes && e('div',{className:'movements'}, en.notes),
    e('button',{className:'del', onClick:()=>removeEntry(en.id), title:'Elimina'}, '×')
  );

  const tabs = [['log','Registra'],['importa','Importa'],['classifica','Classifica'],['pr','PR'],['storico','Storico'],['grafico','Grafico']];

  const showTime = TIME_MODALITIES.includes(modality);
  const showRoundsReps = modality==='AMRAP';
  const showInterval = INTERVAL_MODALITIES.includes(modality);
  const showLoad = modality==='Max Load';
  const showMaxReps = modality==='Max Reps';
  const showCustomAll = modality==='Custom';

  const renderPendingMovementsEditor = (block)=> e(React.Fragment,null,
    e('label',null,'Movimenti'),
    block.movements.map(m=> e('div',{className:'mv-row', key:m.id},
      e('div',{className:'mv-name'}, e('input',{list:'dl-movements', placeholder:'Movimento', value:m.movement, onChange:ev=>updatePendingMovement(block.id,m.id,'movement',ev.target.value)})),
      e('div',{className:'mv-num'}, e('input',{type:'text', placeholder:'Rip', value:m.reps, onChange:ev=>updatePendingMovement(block.id,m.id,'reps',ev.target.value)})),
      e('div',{className:'mv-num'}, e('input',{type:'text', placeholder:'Peso', value:m.weight, onChange:ev=>updatePendingMovement(block.id,m.id,'weight',ev.target.value)})),
      e('button',{className:'mv-del', onClick:()=>removePendingMovementRow(block.id,m.id)}, '×')
    )),
    e('button',{className:'ghost', type:'button', onClick:()=>addPendingMovementRow(block.id)}, '+ Aggiungi movimento')
  );

  const renderPendingScoreFields = (block)=>{
    const upd = (f)=> (ev)=> updatePendingBlock(block.id, f, ev.target.value);
    if(TIME_MODALITIES.includes(block.modality)){
      return e(React.Fragment,null, e('label',null,'Tempo (mm:ss)'), e('input',{type:'text', value:block.scoreTime, onChange:upd('scoreTime')}));
    }
    if(block.modality==='AMRAP'){
      return e('div',{className:'row'},
        e('div',null, e('label',null,'Round'), e('input',{type:'number', value:block.scoreRounds, onChange:upd('scoreRounds')})),
        e('div',null, e('label',null,'Rip extra'), e('input',{type:'number', value:block.scoreExtraReps, onChange:upd('scoreExtraReps')}))
      );
    }
    if(INTERVAL_MODALITIES.includes(block.modality)){
      return e('div',{className:'row'},
        e('div',null, e('label',null,'Round'), e('input',{type:'number', value:block.scoreRounds, onChange:upd('scoreRounds')})),
        e('div',null, e('label',null,'Rip tot.'), e('input',{type:'number', value:block.scoreExtraReps, onChange:upd('scoreExtraReps')}))
      );
    }
    if(block.modality==='Max Load'){
      return e(React.Fragment,null, e('label',null,'Carico (kg)'), e('input',{type:'number', value:block.scoreLoad, onChange:upd('scoreLoad')}));
    }
    if(block.modality==='Max Reps'){
      return e(React.Fragment,null, e('label',null,'Ripetizioni'), e('input',{type:'number', value:block.scoreExtraReps, onChange:upd('scoreExtraReps')}));
    }
    return null;
  };

  return e('div',null,
    e('datalist',{id:'dl-movements'}, MOVEMENTS.map(m=> e('option',{key:m,value:m}))),
    e('datalist',{id:'dl-benchmarks'}, BENCHMARK_WODS.map(m=> e('option',{key:m,value:m}))),

    e('div',{className:'board-header'},
      e('div',null,
        e('h1',null,'The Board'),
        e('div',{className:'sub'},'i tuoi numeri, solo tuoi')
      )
    ),
    loaded && prList.length>0 && e('div',{className:'ticker'},
      prList.slice(0,8).map(p=> e('div',{className:'plate',key:p.id},
        e('div',{className:'name'}, p.name),
        e('div',{className:'val'}, p.weight, e('span',null,' kg'))
      ))
    ),
    e('div',{className:'tabs'},
      tabs.map(([k,l])=> e('div',{key:k, className:'tab'+(tab===k?' active':''), onClick:()=>setTab(k)}, l))
    ),

    tab==='log' && e('div',{className:'card'},
      e('h2',null,'Nuova voce'),
      e('div',{className:'row'},
        e('div',null,
          e('label',null,'Tipo'),
          e('select',{value:kind, onChange:ev=>setKind(ev.target.value)},
            e('option',{value:'lift'},'Alzata / peso massimale'),
            e('option',{value:'wod'},'WOD')
          )
        ),
        e('div',null,
          e('label',null,'Data'),
          e('input',{type:'date', value:date, onChange:ev=>setDate(ev.target.value)})
        )
      ),

      kind==='lift' && e(React.Fragment,null,
        e('label',null,'Movimento'),
        e('input',{list:'dl-movements', value:liftName, onChange:ev=>setLiftName(ev.target.value), placeholder:'Es. Back Squat, Snatch, Pistol Squat...'}),
        e('div',{className:'row'},
          e('div',null, e('label',null,'Peso (kg)'), e('input',{type:'number', step:'0.5', value:weight, onChange:ev=>setWeight(ev.target.value)})),
          e('div',null, e('label',null,'Ripetizioni'), e('input',{type:'number', value:reps, onChange:ev=>setReps(ev.target.value)}))
        ),
        e('label',null,'Note'),
        e('textarea',{value:notes, onChange:ev=>setNotes(ev.target.value), placeholder:'Sensazioni, tecnica, condizioni...'})
      ),

      kind==='wod' && e(React.Fragment,null,
        e('div',{className:'row'},
          e('div',null,
            e('label',null,'Nome WOD (opzionale)'),
            e('input',{list:'dl-benchmarks', value:wodName, onChange:ev=>setWodName(ev.target.value), placeholder:'Es. Fran, o lascia vuoto'})
          ),
          e('div',null,
            e('label',null,'Modalità'),
            e('select',{value:modality, onChange:ev=>setModality(ev.target.value)},
              WOD_MODALITIES.map(m=> e('option',{key:m,value:m},m))
            )
          )
        ),

        e('label',null,'Movimenti'),
        movements.map((m,idx)=> e('div',{className:'mv-row', key:m.id},
          e('div',{className:'mv-name'}, e('input',{list:'dl-movements', placeholder:'Movimento', value:m.movement, onChange:ev=>updateMovementRow(m.id,'movement',ev.target.value)})),
          e('div',{className:'mv-num'}, e('input',{type:'text', placeholder:'Rip / cal / m', value:m.reps, onChange:ev=>updateMovementRow(m.id,'reps',ev.target.value)})),
          e('div',{className:'mv-num'}, e('input',{type:'text', placeholder:'Peso (kg)', value:m.weight, onChange:ev=>updateMovementRow(m.id,'weight',ev.target.value)})),
          e('button',{className:'mv-del', onClick:()=>removeMovementRow(m.id), title:'Rimuovi'}, '×')
        )),
        e('button',{className:'ghost', onClick:addMovementRow, type:'button'}, '+ Aggiungi movimento'),

        showTime && e(React.Fragment,null,
          e('label',null,'Tempo (mm:ss)'),
          e('input',{type:'text', placeholder:'es. 4:12', value:scoreTime, onChange:ev=>setScoreTime(ev.target.value)})
        ),
        showRoundsReps && e('div',{className:'row'},
          e('div',null, e('label',null,'Round completati'), e('input',{type:'number', value:scoreRounds, onChange:ev=>setScoreRounds(ev.target.value)})),
          e('div',null, e('label',null,'Rip extra'), e('input',{type:'number', value:scoreExtraReps, onChange:ev=>setScoreExtraReps(ev.target.value)}))
        ),
        showInterval && e('div',{className:'row'},
          e('div',null, e('label',null,'Round completati'), e('input',{type:'number', value:scoreRounds, onChange:ev=>setScoreRounds(ev.target.value)})),
          e('div',null, e('label',null,'Rip totali (opz.)'), e('input',{type:'number', value:scoreExtraReps, onChange:ev=>setScoreExtraReps(ev.target.value)}))
        ),
        showLoad && e(React.Fragment,null,
          e('label',null,'Carico massimo (kg)'),
          e('input',{type:'number', step:'0.5', value:scoreLoad, onChange:ev=>setScoreLoad(ev.target.value)})
        ),
        showMaxReps && e(React.Fragment,null,
          e('label',null,'Ripetizioni massime'),
          e('input',{type:'number', value:scoreExtraReps, onChange:ev=>setScoreExtraReps(ev.target.value)})
        ),
        showCustomAll && e('div',{className:'row'},
          e('div',null, e('label',null,'Tempo'), e('input',{type:'text', placeholder:'mm:ss', value:scoreTime, onChange:ev=>setScoreTime(ev.target.value)})),
          e('div',null, e('label',null,'Round / Rip'), e('input',{type:'number', value:scoreRounds, onChange:ev=>setScoreRounds(ev.target.value)}))
        ),

        e('label',null,'Note'),
        e('textarea',{value:notes, onChange:ev=>setNotes(ev.target.value), placeholder:'Struttura (es. 21-15-9), scaling, sensazioni...'}),

        e('div',{className:'row'},
          e('div',null,
            e('label',null,'Categoria'),
            e('select',{value:category, onChange:ev=>setCategory(ev.target.value)},
              e('option',{value:'Rx'},'Rx'),
              e('option',{value:'Scaled'},'Scaled')
            )
          )
        ),
        e('div',{className:'share-row'},
          e('input',{type:'checkbox', checked:shareToLB, onChange:ev=>setShareToLB(ev.target.checked)}),
          e('div',{className:'share-label'}, athleteName? `Condividi il risultato nella classifica come "${athleteName}"` : 'Imposta il tuo nome nel tab Classifica per poter condividere')
        )
      ),

      e('button',{className:'primary', onClick:addEntry}, 'Aggiungi alla board'),
      e('div',{className:'status'}, status)
    ),

    tab==='importa' && e('div',null,
      e('div',{className:'card'},
        e('h2',null,'Importa il programma da foto'),
        e('div',{style:{fontSize:'12px',color:'var(--chalk-dim)',marginBottom:'12px',lineHeight:'1.5'}},
          'Carica una o più foto della lavagna, del quaderno o dell\'app condivisa. Se un giorno ha più lavori (es. forza + WOD), puoi caricare più foto insieme: li riconosco tutti e te li propongo qui sotto da controllare prima di salvarli.'),
        e('div',{className:'import-box'+(importBusy?' busy':'')},
          e('label',{className:'import-label'},
            importBusy? 'Analisi in corso...' : '📷 Scegli una o più foto',
            e('input',{type:'file', accept:'image/*', multiple:true, disabled:importBusy,
              onChange: ev=>{ handleFilesSelected(ev.target.files); ev.target.value=''; }})
          ),
          e('div',{className:'import-status'}, importMsg)
        )
      ),

      pendingBlocks.length>0 && e('div',{className:'card'},
        e('h2',null, `Lavori trovati (${pendingBlocks.length})`),
        e('label',null,'Data di questi lavori'),
        e('input',{type:'date', value:pendingDate, onChange:ev=>setPendingDate(ev.target.value)}),

        pendingBlocks.map(block=> e('div',{className:'pending-card', key:block.id},
          e('div',{className:'pc-head'},
            e('span',{className:'pc-type'}, block.type==='lift' ? 'Alzata' : 'WOD'),
            e('button',{className:'pc-del', onClick:()=>removePendingBlock(block.id)}, '×')
          ),

          block.type==='lift' && e(React.Fragment,null,
            e('label',null,'Movimento'),
            e('input',{list:'dl-movements', value:block.name, onChange:ev=>updatePendingBlock(block.id,'name',ev.target.value)}),
            e('div',{className:'row'},
              e('div',null, e('label',null,'Peso (kg)'), e('input',{type:'number', step:'0.5', value:block.weight, onChange:ev=>updatePendingBlock(block.id,'weight',ev.target.value)})),
              e('div',null, e('label',null,'Ripetizioni'), e('input',{type:'number', value:block.reps, onChange:ev=>updatePendingBlock(block.id,'reps',ev.target.value)}))
            ),
            e('label',null,'Note'),
            e('textarea',{value:block.notes, onChange:ev=>updatePendingBlock(block.id,'notes',ev.target.value)})
          ),

          block.type==='wod' && e(React.Fragment,null,
            e('div',{className:'row'},
              e('div',null, e('label',null,'Nome WOD'), e('input',{list:'dl-benchmarks', value:block.wodName, onChange:ev=>updatePendingBlock(block.id,'wodName',ev.target.value)})),
              e('div',null, e('label',null,'Modalità'),
                e('select',{value:block.modality, onChange:ev=>updatePendingBlock(block.id,'modality',ev.target.value)},
                  WOD_MODALITIES.map(m=> e('option',{key:m,value:m},m))
                )
              )
            ),
            renderPendingMovementsEditor(block),
            renderPendingScoreFields(block),
            e('label',null,'Note'),
            e('textarea',{value:block.notes, onChange:ev=>updatePendingBlock(block.id,'notes',ev.target.value)})
          )
        )),

        e('button',{className:'primary', onClick:saveAllPending}, `Salva tutti (${pendingBlocks.length})`),
        e('button',{className:'secondary', onClick:discardPending}, 'Scarta tutto')
      )
    ),

    tab==='classifica' && e('div',null,
      e('div',{className:'athlete-box'},
        e('div',{className:'lbl'},'Il tuo nome'),
        e('input',{value:athleteInput, onChange:ev=>setAthleteInput(ev.target.value), placeholder:'Come apparirai in classifica', onBlur:saveAthleteName}),
        e('button',{className:'secondary', style:{marginTop:0,width:'auto',padding:'9px 14px'}, onClick:saveAthleteName}, 'Salva')
      ),
      !athleteName && e('div',{style:{fontSize:'12px',color:'var(--chalk-dim)',marginBottom:'14px'}}, 'Imposta il tuo nome per poter condividere e comparire nelle classifiche.'),

      e('div',{className:'card'},
        e('h2',null,'Workout con classifica'),
        lbIndex.length===0 ? e('div',{className:'empty'},'Nessun workout condiviso ancora. Registra un WOD con "Condividi il risultato" attivo.') :
        e('div',{className:'wod-list'},
          lbIndex.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(w=> e('div',{
            className:'wod-list-item'+(lbSelected&&lbSelected.key===w.key?' active':''), key:w.key, onClick:()=>loadLeaderboard(w)
          },
            e('div',null, e('div',{className:'wl-name'}, w.name), e('div',{className:'wl-count'}, w.modality))
          ))
        )
      ),

      lbSelected && e('div',{className:'card'},
        e('h2',null, lbSelected.name),
        lbBusy ? e('div',{className:'empty'},'Caricamento...') :
        lbResults.length===0 ? e('div',{className:'empty'}, lbMsg||'Nessun risultato ancora.') :
        (()=>{
          const filtered = lbFilter==='all' ? lbResults : lbResults.filter(r=>r.category===lbFilter);
          const rankable = filtered.filter(r=>r.scoreValue!=null);
          const better = rankable[0] && rankable[0].scoreType==='time' ? 'lower' : 'higher';
          const sorted = rankable.slice().sort((a,b)=> better==='lower' ? a.scoreValue-b.scoreValue : b.scoreValue-a.scoreValue);
          const myIdx = sorted.findIndex(r=>r.athlete===athleteName);
          return e(React.Fragment,null,
            e('div',{className:'lb-filters'},
              ['all','Rx','Scaled'].map(f=> e('div',{key:f, className:'chip'+(lbFilter===f?' active':''), onClick:()=>setLbFilter(f)}, f==='all'?'Tutti':f))
            ),
            myIdx>=0 && e('div',{className:'lb-summary'},
              e('b',null, (myIdx+1)+'°'), ' posto su ', e('b',null, sorted.length), ' · Top ', e('b',null, Math.round(((myIdx+1)/sorted.length)*100)+'%')
            ),
            sorted.map((r,i)=> e('div',{className:'lb-row'+(r.athlete===athleteName?' me':'')+(i===0?' rank-1':i===1?' rank-2':i===2?' rank-3':''), key:r.id},
              e('div',{className:'lb-rank'}, i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'°'),
              e('div',{className:'lb-athlete'}, r.athlete, e('span',{className:'lb-date'}, fmtDate(r.date))),
              e('div',null, r.scoreDisplay, e('span',{className:'rx-badge '+(r.category==='Rx'?'rx':'scaled')}, r.category))
            ))
          );
        })()
      )
    ),

    tab==='pr' && e('div',{className:'card'},
      e('h2',null,'I tuoi record'),
      prList.length===0 ? e('div',{className:'empty'},'Nessun PR ancora. Registra la prima alzata.') :
      prList.map(p=> e('div',{className:'entry', key:p.id},
        e('div',{className:'entry-top'},
          e('div',{className:'left'},
            e('div',{className:'name'}, p.name),
            e('div',{className:'meta'}, p.reps? p.reps+' rip' : '1RM')
          ),
          e('div',{className:'right'},
            e('div',{className:'score'}, p.weight, ' kg'),
            e('div',{className:'date'}, fmtDate(p.date))
          )
        )
      ))
    ),

    tab==='storico' && e('div',{className:'card'},
      e('h2',null,'Storico per giorno'),
      groupedByDate.length===0 ? e('div',{className:'empty'},'Ancora nessuna voce registrata.') :
      groupedByDate.map(g=> e('div',{className:'day-group', key:g.date},
        e('div',{className:'day-header'},
          e('div',{className:'d-date'}, fmtDayHeader(g.date)),
          e('div',{className:'d-count'}, `${g.items.length} lavor${g.items.length===1?'o':'i'}`)
        ),
        g.items.map(en=> renderEntryRow(en))
      ))
    ),

    tab==='grafico' && e('div',null,
      exerciseNames.length===0 ? e('div',{className:'card'}, e('div',{className:'empty'},'Registra almeno un\'alzata per vedere i grafici.')) :
      e('div',null,
        e('div',{className:'exercise-select'},
          exerciseNames.map(n=> e('div',{key:n, className:'chip'+(selectedExercise===n?' active':''), onClick:()=>setSelectedExercise(n)}, n))
        ),
        e('div',{className:'chart-wrap'},
          e('div',{className:'chart-title'}, selectedExercise),
          history.length>0 && e('div',{className:'chart-current'}, 'Ultimo: ', e('b',null, history[history.length-1].weight+' kg'), ' · Massimo: ', e('b',null, Math.max(...history.map(h=>h.weight))+' kg')),
          renderChart()
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
</body>
</html>
